
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Erateini Quest</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 10px;
  text-align: center; font-family: Arial, sans-serif;
  background: #dff4ff; color: #17466a;
  touch-action: manipulation;
}
h2 { margin: 5px; }
canvas {
  width: 100%; max-width: 800px;
  border: 2px solid #17466a;
  border-radius: 8px;
  display: block; margin: 8px auto;
  touch-action: none;
}
.controls {
  max-width: 500px; margin: 12px auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
button {
  font-size: 25px; font-weight: bold;
  border: 0; border-radius: 14px;
  padding: 16px 4px; color: white;
  background: #286bb0;
  box-shadow: 0 4px #17466a;
  touch-action: none;
  user-select: none;
}
button:active { transform: translateY(3px); box-shadow: none; }
#feed { background: #e68a35; }
#restart { background: #438f65; font-size: 17px; }
#message { min-height: 40px; font-weight: bold; }
</style>
</head>
<body>
<h2>🇬🇷 ERATEINI QUEST</h2>
<p>Explore Greece and feed the cats!</p>
<canvas id="game" width="800" height="480"></canvas>
<div id="message">Find a cat and tap FEED! 🐾</div>

<div class="controls">
  <button id="left" aria-label="Left">⬅️</button>
  <button id="up" aria-label="Up">⬆️</button>
  <button id="down" aria-label="Down">⬇️</button>
  <button id="right" aria-label="Right">➡️</button>
  <button id="feed" style="grid-column:span 3">🐾 FEED CAT</button>
  <button id="restart">↻</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

let player, cats, fed, won;
const keys = {left:false,right:false,up:false,down:false};

function reset() {
  player = {x:90,y:355,speed:3};
  cats = [
    {x:220,y:350,color:"#e99b43",fed:false},
    {x:370,y:280,color:"#333b49",fed:false},
    {x:510,y:370,color:"#f4f0df",fed:false},
    {x:650,y:290,color:"#c6a17b",fed:false},
    {x:720,y:390,color:"#8c8c8c",fed:false}
  ];
  fed = 0; won = false;
  message.textContent = "Find a cat and tap FEED! 🐾";
}

function feedCat() {
  if (won) return;
  let nearest = null, distance = Infinity;
  cats.forEach(cat => {
    let d = Math.hypot(player.x-cat.x,player.y-cat.y);
    if (!cat.fed && d < distance) {
      distance = d; nearest = cat;
    }
  });
  if (nearest && distance < 58) {
    nearest.fed = true; fed++;
    if (fed === cats.length) {
      won = true;
      message.textContent = "Amazing! You fed every cat in Erateini! 🇬🇷";
    } else {
      message.textContent = "Meow! Thank you! Cats fed: "+fed+"/5";
    }
  } else {
    message.textContent = "Move closer to a hungry cat first!";
  }
}

function drawCat(cat) {
  const x=cat.x,y=cat.y;
  ctx.fillStyle=cat.color;
  ctx.beginPath();
  ctx.moveTo(x-13,y-8);ctx.lineTo(x-12,y-23);
  ctx.lineTo(x-2,y-13);ctx.lineTo(x+2,y-13);
  ctx.lineTo(x+12,y-23);ctx.lineTo(x+13,y-8);
  ctx.fill();
  ctx.beginPath();ctx.ellipse(x,y+5,17,13,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x,y-8,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#222";
  ctx.fillRect(x-7,y-10,3,4);ctx.fillRect(x+4,y-10,3,4);
  ctx.fillStyle="#ed8ba1";ctx.fillRect(x-2,y-5,4,3);
  ctx.strokeStyle=cat.color;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(x+12,y+8);
  ctx.quadraticCurveTo(x+28,y-2,x+24,y-12);ctx.stroke();
  ctx.fillStyle=cat.fed?"#fff":"#b77a46";
  ctx.fillRect(x-12,y+19,24,7);
  if(cat.fed) {
    ctx.fillStyle="#fff";ctx.font="18px Arial";
    ctx.fillText("♥",x-7,y-28);
  }
}

function draw() {
  ctx.clearRect(0,0,800,480);
  ctx.fillStyle="#82d6f5";ctx.fillRect(0,0,800,480);
  ctx.fillStyle="#ffdf70";ctx.beginPath();
  ctx.arc(720,60,32,0,Math.PI*2);ctx.fill();

  ctx.fillStyle="#78a7a2";ctx.beginPath();
  ctx.moveTo(0,190);ctx.lineTo(160,65);ctx.lineTo(300,190);
  ctx.lineTo(460,85);ctx.lineTo(640,190);ctx.lineTo(800,90);
  ctx.lineTo(800,240);ctx.lineTo(0,240);ctx.fill();

  ctx.fillStyle="#238ec4";ctx.fillRect(0,185,800,125);
  ctx.strokeStyle="#a5e8ff";ctx.lineWidth=3;
  for(let i=0;i<8;i++){
    ctx.beginPath();ctx.moveTo(i*115,220+(i%3)*25);
    ctx.lineTo(i*115+55,220+(i%3)*25);ctx.stroke();
  }

  ctx.fillStyle="#f5dfb4";ctx.fillRect(0,300,800,180);
  ctx.strokeStyle="#d3b98d";ctx.lineWidth=1;
  for(let x=0;x<800;x+=50){
    ctx.beginPath();ctx.moveTo(x,300);ctx.lineTo(x-20,480);ctx.stroke();
  }
  for(let y=330;y<480;y+=35){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke();
  }

  ctx.fillStyle="#fff9e9";
  ctx.fillRect(20,135,125,170);ctx.fillRect(655,115,125,185);
  ctx.fillStyle="#286bb0";
  ctx.beginPath();ctx.moveTo(10,140);ctx.lineTo(82,90);
  ctx.lineTo(155,140);ctx.fill();
  ctx.beginPath();ctx.moveTo(645,120);ctx.lineTo(717,70);
  ctx.lineTo(790,120);ctx.fill();
  ctx.fillStyle="#4aa5dc";
  ctx.fillRect(38,165,28,38);ctx.fillRect(92,165,28,38);
  ctx.fillRect(675,145,30,40);ctx.fillRect(730,145,30,40);
  ctx.fillStyle="#a36d4a";ctx.fillRect(67,235,35,70);

  ctx.fillStyle="#fff";ctx.fillRect(300,190,150,40);
  ctx.strokeStyle="#286bb0";ctx.lineWidth=3;
  ctx.strokeRect(300,190,150,40);
  ctx.fillStyle="#286bb0";ctx.font="bold 19px Arial";
  ctx.textAlign="center";ctx.fillText("TAVERNA",375,216);

  // Greek flag
  ctx.fillStyle="#fff";ctx.fillRect(180,125,45,28);
  ctx.fillStyle="#286bb0";
  for(let i=0;i<4;i++)ctx.fillRect(180,125+i*7,45,3);
  ctx.fillRect(180,125,18,16);
  ctx.fillStyle="#fff";ctx.fillRect(187,125,4,16);
  ctx.fillRect(180,131,18,4);

  cats.forEach(drawCat);

  // Player
  ctx.fillStyle="#254e85";ctx.fillRect(player.x-10,player.y-10,20,28);
  ctx.fillStyle="#f1c6a5";ctx.beginPath();
  ctx.arc(player.x,player.y-18,10,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#70452f";ctx.beginPath();
  ctx.arc(player.x,player.y-22,10,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.fillRect(player.x-8,player.y+18,7,8);
  ctx.fillRect(player.x+2,player.y+18,7,8);

  ctx.fillStyle="rgba(255,255,255,0.92)";
  ctx.fillRect(10,10,220,42);
  ctx.fillStyle="#17466a";ctx.font="bold 17px Arial";
  ctx.textAlign="left";
  ctx.fillText("Erateini | Cats: "+fed+"/5",20,37);

  if(won) {
    ctx.fillStyle="rgba(15,45,75,0.88)";
    ctx.fillRect(100,155,600,130);
    ctx.fillStyle="#fff";ctx.textAlign="center";
    ctx.font="bold 29px Arial";
    ctx.fillText("MISSION COMPLETE!",400,200);
    ctx.font="18px Arial";
    ctx.fillText("Kindness makes every place better!",400,238);
  }
}

function loop() {
  if(!won) {
    if(keys.left)player.x-=player.speed;
    if(keys.right)player.x+=player.speed;
    if(keys.up)player.y-=player.speed;
    if(keys.down)player.y+=player.speed;
    player.x=Math.max(15,Math.min(785,player.x));
    player.y=Math.max(255,Math.min(445,player.y));
  }
  draw();
  requestAnimationFrame(loop);
}

["left","right","up","down"].forEach(dir=>{
  const button=document.getElementById(dir);
  const start=e=>{
    e.preventDefault();keys[dir]=true;
    if(button.setPointerCapture && e.pointerId!==undefined)
      button.setPointerCapture(e.pointerId);
  };
  const stop=e=>{e.preventDefault();keys[dir]=false;};
  button.addEventListener("pointerdown",start);
  button.addEventListener("pointerup",stop);
  button.addEventListener("pointercancel",stop);
  button.addEventListener("lostpointercapture",()=>keys[dir]=false);
  button.addEventListener("contextmenu",e=>e.preventDefault());
});

document.getElementById("feed").addEventListener("pointerdown",e=>{
  e.preventDefault();feedCat();
});
document.getElementById("restart").addEventListener("click",reset);

reset();
loop();
</script>
</body>
</html>
